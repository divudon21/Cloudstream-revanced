name: Revanced APK build and release

on:
  push:
    branches: [ arena/098370c9-cloudstream-revanced ]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a signed GitHub release (requires signing secrets)
        type: boolean
        default: false
      tag:
        description: New release tag, required when publishing (for example v1.0.0-revanced)
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build debug APKs
        run: ./gradlew :app:assembleStableDebug
      - name: Collect requested APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for abi in arm64-v8a armeabi-v7a universal; do
            mapfile -t files < <(find app/build/outputs/apk/stable/debug -name "*${abi}*debug.apk")
            test "${#files[@]}" -eq 1
            cp "${files[0]}" "artifacts/cloudstream-revanced-${abi}-debug.apk"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: cloudstream-revanced-debug-apks
          path: artifacts/*.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Validate release configuration and prepare signing key
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          KEYSTORE_BASE64: ${{ secrets.REVANCED_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.REVANCED_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.REVANCED_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.REVANCED_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]] || { echo 'Provide a valid new release tag.' >&2; exit 1; }
          for name in KEYSTORE_BASE64 SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD SIGNING_STORE_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "Missing required signing secret: $name" >&2; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/revanced.jks"
          test -s "$RUNNER_TEMP/revanced.jks"
      - name: Build signed release APKs
        run: ./gradlew :app:assembleStableRelease
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/revanced.jks
          SIGNING_KEY_ALIAS: ${{ secrets.REVANCED_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.REVANCED_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.REVANCED_STORE_PASSWORD }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          MAL_KEY: ${{ secrets.MAL_KEY }}
          ANILIST_KEY: ${{ secrets.ANILIST_KEY }}
      - name: Collect and verify requested APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          for abi in arm64-v8a armeabi-v7a universal; do
            mapfile -t files < <(find app/build/outputs/apk/stable/release -name "*${abi}*release.apk")
            test "${#files[@]}" -eq 1
            "$APKSIGNER" verify --verbose "${files[0]}"
            cp "${files[0]}" "artifacts/cloudstream-revanced-${abi}.apk"
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/*.apk --target "$GITHUB_SHA" --title "Cloudstream Revanced $RELEASE_TAG" --notes-file RELEASE_NOTES.md
